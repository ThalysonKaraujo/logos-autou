services:
  postgres:
    image: postgres:16-alpine
    container_name: logos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos_secret
      POSTGRES_DB: logos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: